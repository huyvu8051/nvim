# Prefix key: Ctrl+; (Alacritty) or F12 (Termius) instead of the default Ctrl+b
# Alacritty (no Kitty keyboard protocol) can't send a distinct code for
# Ctrl+; on its own, so alacritty.toml remaps it to the CSI-u escape
# sequence "\e[59;5u", which we register here as a tmux user-key.
# Termius has no such remap available, so F12 (set up as a Termius
# shortcut) serves as the second prefix there instead.
unbind C-b
set -s user-keys[0] "\e[59;5u"
set -g prefix User0
set -g prefix2 F12
bind User0 send-prefix
bind F12 send-prefix -2

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# Vim copy mode
setw -g mode-keys vi

# enable clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# Quick switch between window
set -g xterm-keys on

set -g base-index 1
setw -g pane-base-index 1

bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

